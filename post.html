<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CTF writeup reader.">
    <title>CTF Write-up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body data-page="post">
    <div class="site-shell">
      <header class="topbar" aria-label="Primary navigation">
        <a class="brand-mark" href="index.html" aria-label="Home">CTF</a>
        <nav class="nav-links" aria-label="Site">
          <a href="index.html">Posts</a>
          <a class="owner-only" href="editor.html">Editor</a>
          <a class="owner-only" href="guide.html">Guide</a>
          <a href="https://github.com/" target="_blank" rel="noreferrer">GitHub</a>
        </nav>
      </header>

      <main class="reader-layout">
        <aside class="toc-panel" aria-labelledby="toc-title">
          <p class="terminal-kicker">outline</p>
          <h2 id="toc-title">Contents</h2>
          <nav id="toc" class="toc-list"></nav>
        </aside>

        <article class="reader-panel">
          <header class="post-header">
            <a class="back-link" href="index.html">← all posts</a>
            <p id="post-date" class="terminal-kicker"></p>
            <p id="post-event" class="post-event"></p>
            <h1 id="post-title">Loading...</h1>
            <div id="post-tags" class="tag-row"></div>
          </header>
          <div id="post-content" class="markdown-body"></div>
        </article>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
      const ctfAssetVersion = Date.now();
      document.write(`<script src="assets/js/owner.js?v=${ctfAssetVersion}"><\/script>`);
      document.write(`<script src="assets/js/posts.js?v=${ctfAssetVersion}"><\/script>`);
      document.write(`<script src="assets/js/render.js?v=${ctfAssetVersion}"><\/script>`);
      document.write(`<script src="assets/js/blog.js?v=${ctfAssetVersion}"><\/script>`);
    </script>
  </body>
</html>
